<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waistcoats | AL NOOR APPAREL</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="announcement-bar">
        <p>🚚 Free Delivery on Orders | Premium Quality Guaranteed</p>
    </div>

    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="image/logo/logo.png" alt="AL NOOR APPAREL">
            </a>
        </div>

        <div class="menu-toggle">
            <i class="fa-solid fa-bars"></i>
        </div>

    </nav>

</header>


<main>

<section class="hero">

    <div class="hero-content">

        <h1>Waistcoats Collection</h1>

        <p>Discover our premium waistcoats collection.</p>

        <a href="#waistcoats-products" class="hero-btn">
            Shop Now
        </a>

    </div>

</section>


<section id="waistcoats-products" class="products-section">

    <div class="section-title">

        <h2>Our Waistcoats</h2>

        <p>Choose your favorite premium waistcoat.</p>

    </div>

<div class="products-container" id="waistcoatsProducts">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gbyuxveowklqcgyfowko.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wVrexfeejkvvzg23nBBcqw_Uurnyv_B";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const container =
            document.getElementById("waistcoatsProducts");


        const { data: products, error } =
            await supabaseClient
                .from("products")
                .select("*")
                .eq("category", "Waistcoats")
                .order("id", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            container.innerHTML =
                "<p>Products load nahi ho rahe.</p>";

            return;
        }


        if (!products || products.length === 0) {

            container.innerHTML =
                "<p>No waistcoats available.</p>";

            return;
        }


        products.forEach(function (product) {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            card.innerHTML = `

                <img
                    src="${product.image || ""}"
                    alt="${product.name || ""}"
                >

                <h3>
                    ${product.name || ""}
                </h3>

                <p>
                    ${product.description || ""}
                </p>

                <p>
                    Size: ${product.size || ""}
                </p>

                <p>
                    Price: Rs. ${product.price ?? ""}
                </p>

                <a
                    href="https://wa.me/923402787575?text=${encodeURIComponent(
                        "Hello AL NOOR APPAREL, I want to order: " +
                        product.name
                    )}"
                    class="product-btn"
                    target="_blank"
                >
                    Order Now
                </a>

            `;


            container.appendChild(card);

        });

    }
);

</script>

</main>

<!-- PRODUCT IMAGE VIEWER -->

<div id="imageGallery" class="image-gallery">

    <button id="galleryClose" class="gallery-close">
        ×
    </button>

    <img
        id="galleryImage"
        src=""
        alt="Product Image"
    >

</div>

<script src="script.js"></script>

</body>
</html>
